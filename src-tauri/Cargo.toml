[package]
name = "soirvu"
version = "0.1.0"
description = "Soirvu - an encrypted personal diary"
authors = ["Olha Stefanishyna"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soirvu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
# statfs for the §3 filesystem warning (network shares).
libc = "0.2"

soirvu-core = { path = "../crates/soirvu-core" }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
# Contract snapshots for the IPC boundary (src/commands/contract.rs).
insta = "1"

# §9 lock signals: NSWorkspace + distributed notifications.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString"] }

[features]
# Touch ID (Phase 8) is opt-in at build time: it works only
# in a build signed with a development profile carrying the
# keychain entitlement, and that profile expires after about
# a week — so ordinary builds leave it out and never carry
# the entitlement at all. The Touch ID variant is built with
# the overlay config:  tauri build --config
# src-tauri/tauri.touchid.conf.json -- --features touch-id
touch-id = []
