[package]
name = "soirvu"
version = "0.1.0"
description = "Soirvu - an encrypted personal diary"
authors = ["Olha Stefanishyna"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soirvu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1"
# statfs for the §3 filesystem warning (network shares).
libc = "0.2"

soirvu-core = { path = "../crates/soirvu-core" }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
# Contract snapshots for the IPC boundary (src/commands/contract.rs).
insta = "1"
