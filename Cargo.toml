[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[profile.dev.package.argon2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
