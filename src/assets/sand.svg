<svg
  viewBox="0 0 50 50"
  xmlns='http://www.w3.org/2000/svg'>

  <filter id='noiseFilter'>
    <feTurbulence
      type='fractalNoise'
      baseFrequency='7.0'
      numOctaves='3'
      stitchTiles='noStitch'>
    </feTurbulence>
    <feColorMatrix values="0.63 0.3 0.3 0.3 0.21
                           0.53 0.4 0.3 0.3 0.11
                           0.75 0.4 0.3 0 0.10
                           0.9  0.6 0 0.1 0.7"
    />
  </filter>

  <rect
    width='100%'
    height='100%'
    filter='url(#noiseFilter)'>
  </rect>

</svg>
