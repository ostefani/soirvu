<svg
  viewBox="0 0 50 50"
  xmlns='http://www.w3.org/2000/svg'>

  <filter id='noiseFilter'>
    <feTurbulence
      type='fractalNoise'
      baseFrequency='7.0'
      numOctaves='3'
      stitchTiles='noStitch'>
    </feTurbulence>
    <feColorMatrix values="0.63 0.3 0.3 0.3 0.21
                           0.53 0.4 0.3 0.3 0.11
                           0.75 0.4 0.3 0 0.10
                           0.9  0.6 0 0.1 0.7"
    />
    <!-- <feColorMatrix values="0.63 0 0 0.3 0.11
                           0.53 0 0 0.3 0.01
                           0.75 0 0 0 0
                           0.9 0.5 0 0 0.7"
    /> -->
     <!-- <feColorMatrix values="0.53 0 0 0 0
                           0.53 0 0 0 0
                           0.73 0 0 0 0
                           0.9 0.5 0 0 0.5"
    /> -->
    <!-- <feColorMatrix type="saturate" values="0"/> -->
  </filter>

  <rect
    width='100%'
    height='100%'
    filter='url(#noiseFilter)'>
    <!-- <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="100s"
      repeatCount="indefinite" /> -->
  </rect>

</svg>
