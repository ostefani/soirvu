<svg
  viewBox="0 0 50 50"
  xmlns='http://www.w3.org/2000/svg'>

  <filter id='noiseFilter'>
    <feTurbulence
      type='fractalNoise'
      baseFrequency='7.0'
      numOctaves='3'
      stitchTiles='noStitch'>
    </feTurbulence>
    <feColorMatrix values="0.013 0 0.43 0 -0.05
                           0.023 0 0.43 0 -0.05
                           0.013 0 0.53 0 -0.05
                           0.099 0 0.099 0.9 0.01"
    />
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <rect
    width='100%'
    height='100%'
    filter='url(#noiseFilter)'>
  </rect>

</svg>
