name: ci

on:
  push:
    branches: [main]
  pull_request:

# A branch push with an open PR would otherwise run twice (push +
# pull_request); a newer push supersedes the older run in place.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit least privilege. Same-run artifact upload/download
# authenticates with the Actions runtime token rather than the
# job's GITHUB_TOKEN, so every job inherits this read-only scope.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Platform cfg stays in the platform files (§12)
        run: sh scripts/check-platform-cfg.sh

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # SQLCipher/OpenSSL are built from source (rusqlite's
      # bundled-sqlcipher-vendored-openssl): the VC-WIN64A build needs
      # a full perl plus nasm, and Git's own crippled MSYS perl
      # shadows them on PATH. The script installs what is missing,
      # PREPENDS the working dirs to PATH for later steps, and
      # proves both tools run.
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows-openssl-tools.ps1
      - name: Core and CLI tests
        run: cargo test -p soirvu-core -p soirvu-cli
      - name: Clippy (core and CLI)
        run: cargo clippy -p soirvu-core -p soirvu-cli --all-targets

  bridge-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # SQLCipher/OpenSSL are built from source (rusqlite's
      # bundled-sqlcipher-vendored-openssl): the VC-WIN64A build needs
      # a full perl plus nasm, and Git's own crippled MSYS perl
      # shadows them on PATH. The script installs what is missing,
      # PREPENDS the working dirs to PATH for later steps, and
      # proves both tools run.
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows-openssl-tools.ps1
      - name: WebKitGTK system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Check the bridge compiles
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check the Touch ID variant compiles (macOS)
        if: runner.os == 'macOS'
        run: cargo check --manifest-path src-tauri/Cargo.toml --features touch-id

  bridge-tests:
    # The Tauri crate's vault, locking, backup, state and IPC-contract
    # tests: compiling is not proof they pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Same vendored OpenSSL as bridge-check; the default shell keeps
      # the tools step's PATH ordering (no Git Bash shadowing here).
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows-openssl-tools.ps1
      - name: WebKitGTK system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Tauri crate tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  vault-exchange:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # SQLCipher/OpenSSL are built from source (rusqlite's
      # bundled-sqlcipher-vendored-openssl): the VC-WIN64A build needs
      # a full perl plus nasm, and Git's own crippled MSYS perl
      # shadows them on PATH. The script installs what is missing,
      # PREPENDS the working dirs to PATH for later steps, and
      # proves both tools run.
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows-openssl-tools.ps1
      - name: Create a fixture vault on this OS
        shell: bash
        env:
          SOIRVU_MAKE_FIXTURE: ${{ runner.temp }}/fixture
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash shadows the tools step's PATH with its MSYS dirs:
            # restore the Strawberry perl first, and prove it before the
            # minutes-long OpenSSL build.
            # shellcheck disable=SC1091
            . "$(cygpath "$RUNNER_TEMP/soirvu-openssl-path.sh")"
            test "$(command -v perl)" = "/c/Strawberry/perl/bin/perl"
            perl -MLocale::Maketext::Simple -e 'print "perl-ok\n"'
          fi
          cargo test -p soirvu-core --test cross_os -- --exact cross_os_fixture
      - uses: actions/upload-artifact@v6
        with:
          name: fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture
          retention-days: 1

  vault-exchange-open:
    needs: vault-exchange
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          pattern: fixture-*
          path: ${{ runner.temp }}/incoming
      # SQLCipher/OpenSSL are built from source (rusqlite's
      # bundled-sqlcipher-vendored-openssl): the VC-WIN64A build needs
      # a full perl plus nasm, and Git's own crippled MSYS perl
      # shadows them on PATH. The script installs what is missing,
      # PREPENDS the working dirs to PATH for later steps, and
      # proves both tools run.
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows-openssl-tools.ps1
      - name: Open every OS's fixture vault here
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Same MSYS shadowing as the fixture-creation step above.
            # shellcheck disable=SC1091
            . "$(cygpath "$RUNNER_TEMP/soirvu-openssl-path.sh")"
            test "$(command -v perl)" = "/c/Strawberry/perl/bin/perl"
            perl -MLocale::Maketext::Simple -e 'print "perl-ok\n"'
          fi
          for d in "${RUNNER_TEMP}"/incoming/*/; do
            echo "opening $d"
            SOIRVU_OPEN_FIXTURE="$d" cargo test -p soirvu-core --test cross_os -- --exact cross_os_fixture
          done

  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install exactly as the lockfile says, no scripts
        run: npm ci --ignore-scripts
      - name: Frontend tests
        run: npm test
      # Only production dependencies ship in the bundle; dev-only
      # findings stay visible in a local `npm audit` but cannot fail
      # the gate. (vite-plugin-svelte's deepmerge has no fixed
      # release and runs at build time only, never in the app.)
      - name: Audit the frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: The {@html} rule
        run: npm run check
      - name: Build
        run: npm run build
      - name: No external hostnames in the bundle (§9)
        run: sh scripts/check-bundle-hosts.sh dist

  deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The Embark action bundles its own cargo-deny with no version
      # pin, so a schema change in deny.toml breaks it silently.
      # Install the pinned version instead; bump deliberately.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Licenses, advisories, bans, sources
        # Advisories included: deny.toml [advisories] fails on
        # vulnerabilities and yanked crates, so a separate
        # cargo-audit run would only duplicate it.
        run: cargo deny --manifest-path ./Cargo.toml --all-features check

  macos-release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exactly as the lockfile says, no scripts
        run: npm ci --ignore-scripts
      - name: Build the app (ad-hoc signed, hardened runtime)
        run: npm run tauri build
      - name: Verify the signature (§9)
        # src-tauri is a member of the root workspace, so cargo builds
        # into the workspace-root target/, not src-tauri/target/.
        run: sh scripts/verify-release.sh target/release/bundle/macos/SoirVu.app
      # The plaintext-leak test (§10) is manual by design: it asks
      # for two canary entries in a scratch vault, then scans the
      # disk after quit. It cannot run headless in CI; see
      # README.md ("run leak test").
