name: release

# Cutting a release is a tag: push vX.Y.Z, and this workflow
# builds the installers on all three OSes, smoke-tests the
# installs, and publishes a GitHub release with SHA256SUMS
# and its minisign signature. The signing key lives only in
# this repository's secrets (MINISIGN_SECRET_KEY); the
# public key is in BUILDING.md, and building from source
# remains the trust anchor (see BUILDING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            overlay: ""
            verify: sh scripts/verify-release.sh src-tauri/target/release/bundle/macos/soirvu.app
          - os: ubuntu-26.04
            overlay: "--config src-tauri/tauri.linux.conf.json"
            verify: sh scripts/verify-release-linux.sh src-tauri/target/release/soirvu
          - os: windows-latest
            overlay: "--config src-tauri/tauri.windows.conf.json"
            verify: python scripts/verify-release-windows.py src-tauri/target/release/soirvu.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # SQLCipher/OpenSSL are built from source (rusqlite's
      # bundled-sqlcipher-vendored-openssl): the VC-WIN64A build needs
      # a full perl plus nasm. The image ships both, but Git's own
      # crippled perl shadows them. Prefer the working tools, then
      # prove it: a silent PATH miss fails here in seconds, not in
      # the OpenSSL build minutes later.
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) { choco install strawberryperl -y --no-progress }
          if (-not ((Get-Command nasm -ErrorAction SilentlyContinue) -or (Test-Path 'C:\Program Files\NASM\nasm.exe'))) { choco install nasm -y --no-progress }
          "C:\Strawberry\perl\bin" | Add-Content -Path $env:GITHUB_PATH
          "C:\Program Files\NASM" | Add-Content -Path $env:GITHUB_PATH
          & "C:\Strawberry\perl\bin\perl.exe" -MLocale::Maketext::Simple -e "print 'perl-ok'"
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe")) { throw "nasm missing; the OpenSSL build would fail" }
      - name: WebKitGTK build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Control Flow Guard (Windows)
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C control-flow-guard=yes" >> $GITHUB_ENV
      - run: npm ci --ignore-scripts
      - name: Build the installer
        run: npm run tauri build -- ${{ matrix.overlay }}
      - name: Verify the release binary
        run: ${{ matrix.verify }}
      - name: Install smoke test (Ubuntu .deb)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          mkdir -p /tmp/fakevault && touch /tmp/fakevault/keep.txt
          sudo dpkg -i "$deb"
          test -x /usr/bin/soirvu
          sudo dpkg -r soirvu
          test -f /tmp/fakevault/keep.txt
      - name: Install smoke test (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:TEMP\fakevault" | Out-Null
          New-Item -ItemType File -Force "$env:TEMP\fakevault\keep.txt" | Out-Null
          Start-Process $exe.FullName -ArgumentList "/S" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\soirvu\soirvu.exe")) { throw "install did not place the app" }
          Start-Process "$env:LOCALAPPDATA\soirvu\uninstall.exe" -ArgumentList "/S" -Wait
          if (-not (Test-Path "$env:TEMP\fakevault\keep.txt")) { throw "uninstall touched a vault folder" }
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Checksums and signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get install -y minisign
          cd dist
          sha256sum * > SHA256SUMS
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          minisign -S -s /tmp/minisign.key -x SHA256SUMS.minisig -m SHA256SUMS <<< "$MINISIGN_PASSWORD"
          rm /tmp/minisign.key
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
