name: release

# Cutting a release is a tag: push vX.Y.Z, and this workflow
# builds the installers on all three OSes, smoke-tests the
# installs, and publishes a GitHub release with SHA256SUMS
# and its minisign signature. The signing key lives only in
# this repository's secrets (MINISIGN_SECRET_KEY); the
# public key is in BUILDING.md, and building from source
# remains the trust anchor (see BUILDING.md).
# The installers themselves stay ad-hoc-signed (macOS) and
# unsigned (Windows) by design for source-first distribution;
# Developer ID / Authenticode signing is the step up if the
# audience ever needs OS-vendor trust.
on:
  push:
    tags: ["v*"]

# Least privilege: build jobs only read and upload artifacts; only
# `publish` can write (the release) and read back artifacts.
permissions:
  contents: read

jobs:
  gate:
    # A tag can point at any commit, so a tag alone proves nothing.
    # Publishing requires a green `ci` run on the exact tagged SHA;
    # anything else — including an API error — refuses the release.
    # (The tagged commit almost always already passed CI on main,
    # so the common path finds that run immediately.)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          green="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 \
            --json conclusion,status \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "${green:-0}" -gt 0 || {
            echo "FAIL: no successful ci.yml run on $GITHUB_SHA — rerun this job after CI goes green"
            exit 1
          }
          echo "OK: CI passed on the tagged commit"

  build:
    needs: gate
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # src-tauri is a member of the root workspace, so cargo builds
          # into the workspace-root target/, not src-tauri/target/.
          - os: macos-15
            overlay: ""
            verify: sh scripts/verify-release.sh target/release/bundle/macos/SoirVu.app
          - os: ubuntu-26.04
            overlay: "--config src-tauri/tauri.linux.conf.json"
            verify: sh scripts/verify-release-linux.sh target/release/soirvu
          - os: windows-2025
            overlay: "--config src-tauri/tauri.windows.conf.json"
            verify: python scripts/verify-release-windows.py target/release/soirvu.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # SQLCipher/OpenSSL are built from source (rusqlite's
      # bundled-sqlcipher-vendored-openssl): the VC-WIN64A build needs
      # a full perl plus nasm, and Git's own crippled MSYS perl
      # shadows them on PATH. The script installs what is missing,
      # PREPENDS the working dirs to PATH for later steps, and
      # proves both tools run.
      - name: OpenSSL build tools (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows-openssl-tools.ps1
      - name: WebKitGTK build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Control Flow Guard (Windows)
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C control-flow-guard=yes" >> $GITHUB_ENV
      - run: npm ci --ignore-scripts
      - name: Build the installer
        run: npm run tauri build -- ${{ matrix.overlay }}
      - name: Verify the release binary
        run: ${{ matrix.verify }}
      - name: Install smoke test (Ubuntu .deb)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls target/release/bundle/deb/*.deb)
          mkdir -p /tmp/fakevault && touch /tmp/fakevault/keep.txt
          sudo dpkg -i "$deb"
          test -x /usr/bin/soirvu
          sudo dpkg -r soirvu
          test -f /tmp/fakevault/keep.txt
      - name: Install smoke test (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:TEMP\fakevault" | Out-Null
          New-Item -ItemType File -Force "$env:TEMP\fakevault\keep.txt" | Out-Null
          Start-Process $exe.FullName -ArgumentList "/S" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\soirvu\soirvu.exe")) { throw "install did not place the app" }
          Start-Process "$env:LOCALAPPDATA\soirvu\uninstall.exe" -ArgumentList "/S" -Wait
          if (-not (Test-Path "$env:TEMP\fakevault\keep.txt")) { throw "uninstall touched a vault folder" }
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Needs a `release` environment in the repo settings holding the
    # Minisign secrets (and any required reviewers): until one exists
    # this only names the intent, but with it configured the secrets
    # stay withheld and the job gated until approval.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Install minisign (no secrets in this step)
        run: sudo apt-get install -y minisign
      - name: Checksums and signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          keyfile="$(mktemp "$RUNNER_TEMP/minisign.XXXXXX")"
          chmod 600 "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$keyfile"
          minisign -S -s "$keyfile" -x SHA256SUMS.minisig -m SHA256SUMS <<< "$MINISIGN_PASSWORD"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
