[package]
name = "soirvu-core"
version = "1.0.2"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
hkdf = "0.13.0"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v7"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

# mlock for the master key's pages (§9).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
